name: Python CI CD Pipeline

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirement.txt


  test:

    needs: build

    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirement.txt

      - name: Run Flask tests
        run: pytest
      - name: Create test report
        run: pytest > test-report.txt
      - name: Upload test report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: test-report.txt


  deploy:

    needs: test

    runs-on: ubuntu-latest

    steps:

      - name: Deploy application
        run: echo "Flask application tests passed and deployment stage completed!"